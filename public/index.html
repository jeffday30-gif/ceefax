<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CEEFAX">
  <meta name="mobile-web-app-capable" content="yes">
  <title>CEEFAX</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="frame">
    <canvas id="screen" width="480" height="500" aria-label="Ceefax page"></canvas>
    <div id="status-line" aria-live="polite"></div>
    <div id="keypad" role="group" aria-label="Page keypad">
      <button class="key" data-digit="1" type="button">1</button>
      <button class="key" data-digit="2" type="button">2</button>
      <button class="key" data-digit="3" type="button">3</button>
      <button class="key" data-digit="4" type="button">4</button>
      <button class="key" data-digit="5" type="button">5</button>
      <button class="key" data-digit="6" type="button">6</button>
      <button class="key" data-digit="7" type="button">7</button>
      <button class="key" data-digit="8" type="button">8</button>
      <button class="key" data-digit="9" type="button">9</button>
      <button class="key key-fn" data-action="clear" type="button">CLR</button>
      <button class="key" data-digit="0" type="button">0</button>
      <button class="key key-fn" data-action="hold" id="hold-btn" type="button">HOLD</button>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
