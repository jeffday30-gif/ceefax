<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=2, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Teletext">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Teletext Reborn</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="frame">
    <div class="tv">
      <div class="tv-bezel">
        <div class="tv-screen">
          <canvas id="screen" width="480" height="500" aria-label="Teletext page"></canvas>
        </div>
      </div>
      <div class="tv-brand">TELETEXT REBORN</div>
    </div>
    <div class="controls">
    <div id="status-line" aria-live="polite"></div>
    <div class="remote">
      <div id="fastext-row" role="group" aria-label="Fastext buttons">
        <button class="fkey fkey-red"    data-fastext="red"    type="button"><span class="fkey-label">NEWS</span></button>
        <button class="fkey fkey-green"  data-fastext="green"  type="button"><span class="fkey-label">SPORT</span></button>
        <button class="fkey fkey-yellow" data-fastext="yellow" type="button"><span class="fkey-label">WEATHER</span></button>
        <button class="fkey fkey-cyan"   data-fastext="cyan"   type="button"><span class="fkey-label">TV</span></button>
      </div>
      <div id="keypad" role="group" aria-label="Page keypad">
        <button class="key" data-digit="1" type="button">1</button>
        <button class="key" data-digit="2" type="button">2</button>
        <button class="key" data-digit="3" type="button">3</button>
        <button class="key" data-digit="4" type="button">4</button>
        <button class="key" data-digit="5" type="button">5</button>
        <button class="key" data-digit="6" type="button">6</button>
        <button class="key" data-digit="7" type="button">7</button>
        <button class="key" data-digit="8" type="button">8</button>
        <button class="key" data-digit="9" type="button">9</button>
        <button class="key key-fn" data-action="clear" type="button">CLR</button>
        <button class="key" data-digit="0" type="button">0</button>
        <button class="key key-fn" data-action="hold" id="hold-btn" type="button">HOLD</button>
      </div>
      <div id="subpage-row" role="group" aria-label="Sub-page navigation" hidden>
        <button class="subkey" data-sub="prev" type="button" aria-label="Previous sub-page">&lt;</button>
        <span id="subpage-indicator">1/1</span>
        <button class="subkey" data-sub="next" type="button" aria-label="Next sub-page">&gt;</button>
      </div>
      <div id="nav-row" role="group" aria-label="Quick navigation">
        <button class="navkey" data-nav="100" type="button">HOME</button>
        <button class="navkey" data-nav="199" type="button">INDEX</button>
        <button class="navkey" data-nav="198" type="button">ABOUT</button>
      </div>
    </div>
    <div id="hint">Type a 3-digit page number or tap a colour button</div>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
